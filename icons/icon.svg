<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="TPFS WMS">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a8aff"/>
      <stop offset="100%" stop-color="#1859c4"/>
    </linearGradient>
  </defs>
  <!-- rounded square background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- minimal warehouse glyph: pallet rack silhouette -->
  <g fill="#fff">
    <!-- shelving uprights -->
    <rect x="100" y="120" width="20" height="280" rx="4"/>
    <rect x="392" y="120" width="20" height="280" rx="4"/>
    <!-- top beam -->
    <rect x="100" y="120" width="312" height="22" rx="4"/>
    <!-- middle beam -->
    <rect x="100" y="244" width="312" height="22" rx="4"/>
    <!-- bottom beam -->
    <rect x="100" y="378" width="312" height="22" rx="4"/>
    <!-- product boxes -->
    <rect x="138" y="160" width="60" height="68" rx="6" fill="#ffd591"/>
    <rect x="222" y="160" width="60" height="68" rx="6" fill="#ffe4a3"/>
    <rect x="306" y="160" width="84" height="68" rx="6" fill="#a3ffb3"/>
    <rect x="138" y="284" width="84" height="78" rx="6" fill="#a3ffb3"/>
    <rect x="246" y="284" width="60" height="78" rx="6" fill="#ffe4a3"/>
    <rect x="330" y="284" width="60" height="78" rx="6" fill="#ffd591"/>
  </g>
</svg>
